# Leafline plant shop as microservices (SOAP between services).
#
#   docker compose up --build            # storefront on http://localhost:5000
#   docker compose --profile test run --rm smoke-tests   # end-to-end SOAP tests
#   docker compose down -v               # stop and delete the databases
#
# Only the gateway is published to the host. catalog / auth / order are reachable
# only on the internal network (by service name), and each owns its own database volume.
name: leafline

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [leafline-net]

services:
  catalog-service:
    <<: *service-defaults
    build: ./catalog-service
    image: leafline/catalog-service:${IMAGE_TAG:-latest}
    environment:
      PORT: "5001"
      DB_PATH: /data/catalog.db
    volumes:
      - catalog-data:/data

  auth-service:
    <<: *service-defaults
    build: ./auth-service
    image: leafline/auth-service:${IMAGE_TAG:-latest}
    environment:
      PORT: "5002"
      DB_PATH: /data/auth.db
    volumes:
      - auth-data:/data

  order-service:
    <<: *service-defaults
    build: ./order-service
    image: leafline/order-service:${IMAGE_TAG:-latest}
    environment:
      PORT: "5003"
      DB_PATH: /data/orders.db
      AUTH_WSDL: http://auth-service:5002/soap/?wsdl
      CATALOG_WSDL: http://catalog-service:5001/soap/?wsdl
    volumes:
      - order-data:/data
    depends_on:
      auth-service: {condition: service_healthy}
      catalog-service: {condition: service_healthy}

  gateway:
    <<: *service-defaults
    build: ./gateway
    image: leafline/gateway:${IMAGE_TAG:-latest}
    environment:
      PORT: "5000"
      CATALOG_URL: http://catalog-service:5001
      AUTH_URL: http://auth-service:5002
      ORDER_URL: http://order-service:5003
      CATALOG_WSDL: http://catalog-service:5001/soap/?wsdl
      AUTH_WSDL: http://auth-service:5002/soap/?wsdl
      ORDER_WSDL: http://order-service:5003/soap/?wsdl
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    depends_on:
      catalog-service: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      order-service: {condition: service_healthy}

  # Only runs with:  docker compose --profile test run --rm smoke-tests
  smoke-tests:
    build: ./integration-tests
    image: leafline/integration-tests:${IMAGE_TAG:-latest}
    profiles: [test]
    environment:
      GATEWAY_URL: http://gateway:5000
    networks: [leafline-net]
    depends_on:
      gateway: {condition: service_healthy}

networks:
  leafline-net:

volumes:
  catalog-data:
  auth-data:
  order-data:
